name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and check the specs index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run specs:check

  specs:
    name: Lint specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # A spec that does not parse is worse than no spec: consumers generate
      # clients from it and the failure surfaces in their build, not ours.
      - run: npx --yes @redocly/cli@1.25.11 lint specs/*.yaml
